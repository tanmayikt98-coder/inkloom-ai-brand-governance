version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inkloom-backend
    ports:
      - "8000:8000"
    environment:
      - INKLOOM_ENV=production
      - DEMO_MODE=true
      - SECRET_KEY=inkloom-brandtrace-production-key-2026
      - DATABASE_URL=sqlite+aiosqlite:///./inkloom.db
      - DATABASE_SYNC_URL=sqlite:///./inkloom.db
      - AI_PROVIDER=deterministic_fallback
    volumes:
      - inkloom-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: inkloom-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  inkloom-data:
